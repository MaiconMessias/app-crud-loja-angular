<h2 mat-dialog-title>Confirmação</h2>
<mat-dialog-content>
  <p>Confirma a exclusão do registro ?</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button [mat-dialog-close]="false">{{ btnNo }}</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial>{{ btnYes }}</button>
</mat-dialog-actions>
